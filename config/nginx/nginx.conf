# Configuração principal, igual nos dois modos. Os servidores HTTP vêm do template de cada modo
# (config/nginx/dev ou config/nginx/prod), que o entrypoint da imagem renderiza em /etc/nginx/conf.d.
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS do Docker, consultado a cada 10 s: com o upstream numa variável, o nginx sobe mesmo com um serviço
    # parado e acompanha o IP novo quando o painel reinicia um container
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Saúde do próprio nginx (healthcheck do compose); não é publicada
    server {
        listen 8099;
        location = /saude {
            access_log off;
            return 200 "ok\n";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}

# TCP (só no dev: Postgres em 127.0.0.1). Sem arquivos em stream.d, o bloco fica vazio
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/stream.d/*.conf;
}
