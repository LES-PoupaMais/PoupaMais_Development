# Cabeçalhos repassados ao upstream. Host com a porta ($http_host): o Next compara o Origin das Server Actions
# com ele (X-Forwarded-Host) e recusa a ação se forem diferentes.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
# WebSocket (HMR do "next dev", atualizações ao vivo do Mailpit)
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
